<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B2418" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Gisela" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Entrar · Gisela</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="login-page">
      <div class="card login-card">
        <p class="login-brand"><span aria-hidden="true">⚽</span> Gisela</p>
        <h1 class="login-sub">Entre para controlar jogadores e mensalidades.</h1>
        <form class="form" id="login-form" novalidate>
          <div class="field">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required />
          </div>
          <div class="field">
            <label for="password">Senha</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </div>
          <p class="form-error" id="login-error" role="alert" hidden></p>
          <button type="submit" class="btn btn-block" id="login-submit">Entrar</button>
        </form>
      </div>
    </main>
    <script type="module" src="js/pages/login.js"></script>
    <script type="module" src="js/pwa.js"></script>
  </body>
</html>
